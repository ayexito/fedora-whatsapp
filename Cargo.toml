[package]
name = "whatsapp-desktop"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Unofficial Rust desktop controller with a sandboxed Chromium WhatsApp client"

[dependencies]
gtk = { package = "gtk4", version = "=0.11.4", features = ["v4_10"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_5"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
